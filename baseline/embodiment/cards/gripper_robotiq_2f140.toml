# Robotiq 2F-140 four-bar linkage. q = driver knuckle angle: 0 open .. q_closed closed; Robotiq register 0..255 is
# linear in q (assembly actuator "fingers"). Each chain runs gripper base -> fingertip frame (the URDF pad frame:
# +y toward the tip, +z away from the object). Joint angle = coef * q (URDF mimic ratios / MuJoCo equalities).
kind = "linkage_gripper"
name = "Robotiq 2F-140"
source = "PickNik ros2_robotiq_gripper robotiq_2f_140_macro.urdf.xacro (model/robotiq_2f140/), as copied into assembly/ur10e_2f140.xml"
q_closed = 0.7
register_max = 255
stroke = 0.140
force_range = [10.0, 125.0]   # N per finger over the force register 0..255 (2F-140 data sheet)

[mount]                       # gripper base in the coupling frame: the URDF turns the 2F-140 by pi/2 about z
pos = [0.0, 0.0, 0.0]
rpy = [0.0, 0.0, 1.5707963]

[[chain.left]]                # outer knuckle, driven joint (axis -x, angle q)
pos = [0.0, -0.030601, 0.054905]
rpy = [2.2957963, 0.0, 0.0]
axis = [-1.0, 0.0, 0.0]
coef = 1.0
[[chain.left]]                # outer finger
pos = [0.0, 0.01821998610742, 0.0260018192872234]
[[chain.left]]                # inner finger, follower joint (mimic +1)
pos = [0.0, 0.0817554015893473, -0.0282203446692936]
rpy = [-0.725, 0.0, 0.0]
axis = [1.0, 0.0, 0.0]
coef = 1.0
[[chain.left]]                # fingertip frame
pos = [0.0, 0.0457554015893473, -0.0272203446692936]

[[chain.right]]               # mirror: yaw pi; the right driver turns by -q about +x
pos = [0.0, 0.030601, 0.054905]
rpy = [2.2957963, 0.0, 3.1415927]
axis = [1.0, 0.0, 0.0]
coef = -1.0
[[chain.right]]
pos = [0.0, 0.01821998610742, 0.0260018192872234]
[[chain.right]]
pos = [0.0, 0.0817554015893473, -0.0282203446692936]
rpy = [-0.725, 0.0, 0.0]
axis = [1.0, 0.0, 0.0]
coef = 1.0
[[chain.right]]
pos = [0.0, 0.0457554015893473, -0.0272203446692936]
